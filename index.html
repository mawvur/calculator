<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор</title>
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg">
        <div class="container">  
            <input type="text" placeholder="0"/>
            <button class="clear" id="clear">С</button>
            <button class="sign" id="delete">&#177;</button>
            <button class="sign" id="percent">%</button>
            <button class="sign" id="div">&#247;</button>
            <button class="number" id="n7" >7</button>
            <button class="number" id="n8">8</button>
            <button class="number" id="n9">9</button>
            <button class="sign" id="mult">&#215;</button>
            <button class="number" id="n4">4</button>
            <button class="number" id="n5">5</button>
            <button class="number" id="n6">6</button>
            <button class="sign" id="minus">-</button>
            <button class="number" id="n1">1</button>
            <button class="number" id="n2">2</button>
            <button class="number" id="n3">3</button>
            <button class="sign" id="sum">+</button>
            <button class="number" id="n0">0</button>
            <button class="number" id="point">,</button>
            <button class="sign" id="is">=</button>           
        </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
